[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "env-telemetry-risk-pipeline"
version = "0.1.0"
description = "A small environmental telemetry ML pipeline with training, anomaly detection, and validation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Codex and collaborators" }
]
dependencies = [
  "joblib",
  "matplotlib",
  "numpy",
  "pandas",
  "scikit-learn",
]

[project.optional-dependencies]
dev = [
  "build",
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["src"]
