name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          pip install .[dev]

      - name: Smoke compile
        run: python -m compileall src tests scripts

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Smoke CLI validate
        run: python -m src validate --input data/raw/raw_dataset.csv

      - name: Smoke CLI profile
        run: python -m src profile --input data/raw/raw_dataset.csv

      - name: Run tests
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    needs: test
    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          pip install .[dev]

      - name: Build package
        run: python -m build --no-isolation

      - name: Generate synthetic review dataset
        run: python scripts/generate_synthetic_data.py --output data/raw/synthetic_dataset.csv --rows 250 --seed 42

      - name: Validate synthetic review dataset
        run: python -m src validate --input data/raw/synthetic_dataset.csv

      - name: Profile synthetic review dataset
        run: python -m src profile --input data/raw/synthetic_dataset.csv

      - name: Train synthetic review model
        run: python -m src train --input data/raw/synthetic_dataset.csv

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  container-smoke:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build -t env-telemetry-risk-pipeline:ci .

      - name: Run container validation smoke test
        run: docker run --rm env-telemetry-risk-pipeline:ci
